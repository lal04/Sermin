{% extends "base.html" %}

{% block title %}Eliminar Documento{% endblock %}

{% block content %}
<div class="form-container">
    <h1>Eliminar Documento</h1>
    <p>¿Estás seguro de que deseas eliminar el documento "{{ object }}"?</p>
    <form method="post">
        {% csrf_token %}
        <div class="form-actions">
            <button type="submit" class="btn">Eliminar</button>
            <a href="{% url 'documento_list' %}" class="btn">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
