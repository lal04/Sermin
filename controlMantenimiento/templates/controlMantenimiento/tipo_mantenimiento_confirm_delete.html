{% extends 'base.html' %}

{% block title %}Eliminar Tipo de Mantenimiento{% endblock %}

{% block content %}
    <div class="form-container">
        <h1>Eliminar Tipo de Mantenimiento</h1>
        <p>¿Estás seguro de que deseas eliminar el tipo de mantenimiento "{{ object }}"?</p>
        <form method="post">
            {% csrf_token %}
            <div class="form-actions">
                <button type="submit" class="btn">Eliminar</button>
                <a href="{% url 'tipo_mantenimiento_list' %}" class="btn">Cancelar</a>
            </div>
        </form>
    </div>
{% endblock %}
